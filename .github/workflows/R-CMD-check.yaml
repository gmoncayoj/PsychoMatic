name: R-CMD-check.yaml

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      R_KEEP_PKG_SOURCE: yes
      # CRAN runs the bounded default suite; CI retains all native regressions.
      PSYCHOMATIC_EXTENDED_TESTS: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install macOS graphics libraries
        if: runner.os == 'macOS'
        run: brew install --cask xquartz
      - name: Configure Ubuntu package downloads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i -E 's|https?://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/99ci-download-timeouts
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
            any::yaml
          needs: check
      - name: Verify report and graphics dependencies
        run: Rscript .github/scripts/check-ci-prerequisites.R
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
      - name: Install reference documentation tools
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          sudo apt-get install -y tidy
          tlmgr update --self
          tlmgr install makeindex
          command -v tidy
          command -v makeindex
      - name: Validate and build both complete reference manuals
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: Rscript docs/manuals/build_manuals.R
      - name: Preserve manual compilation diagnostics
        if: failure() && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: manual-compilation-diagnostics
          path: docs/manuals/work/
          if-no-files-found: ignore
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && 'c("--as-cran")' || 'c("--no-manual", "--as-cran")' }}
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
