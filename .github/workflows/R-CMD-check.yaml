name: R-CMD-check.yaml

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      R_KEEP_PKG_SOURCE: yes
      # CRAN runs the bounded default suite; CI retains all native regressions.
      PSYCHOMATIC_EXTENDED_TESTS: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install macOS graphics libraries
        if: runner.os == 'macOS'
        run: brew install --cask xquartz
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
            any::yaml
          needs: check
      - name: Verify report and graphics dependencies
        run: Rscript .github/scripts/check-ci-prerequisites.R
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
      - name: Install reference manual indexing tools
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          tlmgr update --self
          tlmgr install makeindex
          command -v makeindex
      - name: Validate and build both complete reference manuals
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: Rscript docs/manuals/build_manuals.R
      - name: Preserve manual compilation diagnostics
        if: failure() && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: manual-compilation-diagnostics
          path: docs/manuals/work/
          if-no-files-found: ignore
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' && 'c("--as-cran")' || 'c("--no-manual", "--as-cran")' }}
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
